events {}

http {
  # Socket.IO starts as HTTP and may upgrade its connection to WebSocket.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream mini_erp_api {
    # Keep a client on the same API instance while Socket.IO may still use
    # HTTP polling before upgrading to WebSocket. Redis still distributes
    # emitted events between the API instances.
    ip_hash;
    server api:3000;
    server api-2:3000;
  }

  server {
    listen 80;
    client_max_body_size 5m; # to prevent 413 Request Entity Too Large errors when uploading files to the API.

    location / {
      proxy_pass http://mini_erp_api;
      proxy_http_version 1.1;

      # Preserve useful request information for Express logs and future HTTPS.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Required when Socket.IO upgrades an HTTP connection to WebSocket.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
