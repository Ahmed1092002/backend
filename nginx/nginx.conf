events {}

http {
  # Socket.IO starts as HTTP and may upgrade its connection to WebSocket.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream mini_erp_api {
    # Compose gives a recreated container a new IP while keeping its service
    # name. Re-resolve Docker's internal DNS so a rolling deploy does not leave
    # Nginx pointing at an old address.
    zone mini_erp_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Keep a client on the same API instance while Socket.IO may still use
    # HTTP polling before upgrading to WebSocket. Redis still distributes
    # emitted events between the API instances.
    ip_hash;

    # After one connection failure, temporarily avoid that instance for 10s.
    server api:3000 resolve max_fails=1 fail_timeout=10s;
    server api-2:3000 resolve max_fails=1 fail_timeout=10s;
  }

  server {
    listen 80;
    client_max_body_size 5m; # Reject oversized uploads before the API.

    location / {
      proxy_pass http://mini_erp_api;
      proxy_http_version 1.1;

      # Passive failover: try the other upstream for connection errors or
      # gateway failures. We do not enable `non_idempotent`, so POST is not
      # blindly replayed after it may already have reached an API.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;

      # Preserve useful request information for Express logs and future HTTPS.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Required when Socket.IO upgrades an HTTP connection to WebSocket.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
