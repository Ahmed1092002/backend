# Copy to postgres-secret.yaml, replace the values, and keep the real file out
# of Git. The API DATABASE_URL must use the same password.
apiVersion: v1
kind: Secret
metadata:
  name: mini-erp-postgres-secrets
  namespace: mini-erp
type: Opaque
stringData:
  POSTGRES_USER: erp_user
  POSTGRES_PASSWORD: REPLACE_WITH_A_STRONG_PASSWORD
  POSTGRES_DB: mini_erp
