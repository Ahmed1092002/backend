apiVersion: v1
kind: Service
metadata:
  name: mini-erp-api
  namespace: mini-erp
spec:
  # ClusterIP gives other Pods one stable internal DNS name. It distributes
  # traffic only to Pods whose readiness probe is passing.
  type: ClusterIP
  selector:
    app: mini-erp-api
  ports:
    - name: http
      port: 80
      targetPort: http
