# Copy this file to api-secret.yaml, replace the placeholders, and keep that
# real file out of Git. A Secret is for credentials; ConfigMap is for ordinary
# configuration.
apiVersion: v1
kind: Secret
metadata:
  name: mini-erp-api-secrets
  namespace: mini-erp
type: Opaque
stringData:
  DATABASE_URL: postgresql://erp_user:REPLACE_ME@postgres:5432/mini_erp?schema=public
  JWT_SECRET: REPLACE_WITH_A_LONG_RANDOM_SECRET
