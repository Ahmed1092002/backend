global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mini-erp-api
    metrics_path: /metrics
    static_configs:
      # Docker Compose service names work as hostnames on the internal network.
      - targets: ["api:3000"]
