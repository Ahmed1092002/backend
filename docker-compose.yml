name: mini-erp
services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-erp-postgres
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: mini_erp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/mini_erp?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    command: npm run db:seed
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/mini_erp?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
  api:
    build:
      context: .
    ports:
      # Direct access is kept temporarily to compare it with the Nginx path.
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/mini_erp?schema=public
      JWT_SECRET: local-development-only-replace-with-a-random-secret-before-production
      CLIENT_ORIGIN: http://localhost:5173
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      REDIS_URL: redis://redis:6379
      LOW_STOCK_THRESHOLD: 5
      INSTANCE_NAME: api-1
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - upload_images:/app/uploads
    healthcheck:
      # Readiness means the API process is up and can reach PostgreSQL.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
  api-2:
    # A second copy of the same API. It has no host port: outside traffic goes
    # through Nginx, which can distribute requests to both instances.
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/mini_erp?schema=public
      JWT_SECRET: local-development-only-replace-with-a-random-secret-before-production
      CLIENT_ORIGIN: http://localhost:5173
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      REDIS_URL: redis://redis:6379
      LOW_STOCK_THRESHOLD: 5
      INSTANCE_NAME: api-2
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      # Both instances must see the same files in this single-host lab.
      - upload_images:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
  nginx:
    image: nginx:alpine
    ports:
      # Learning setup: keep API port 3000 available too, so the difference
      # between a direct request and a reverse-proxied request is visible.
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
      api-2:
        condition: service_started
  worker:
    build: .
    command: npx tsx src/workers/email.worker.ts
    environment:
      JWT_SECRET: local-development-only-replace-with-a-random-secret-before-production
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_started
      mailpit:
        condition: service_started
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: mini-erp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started
      api-2:
        condition: service_started
      alertmanager:
        condition: service_started
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: mini-erp-alertmanager
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    depends_on:
      mailpit:
        condition: service_started
  grafana:
    image: grafana/grafana:13.2.2
    container_name: mini-erp-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
volumes:
  postgres_data:
  redis_data:
  upload_images:
  prometheus_data:
  alertmanager_data:
  grafana_data:
