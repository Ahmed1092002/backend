name: mini-erp
services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-erp-postgres
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: mini_erp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/mini_erp?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    command: npm run db:seed
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/mini_erp?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
  api:
    build:
      context: .
    container_name: mini-erp-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/mini_erp?schema=public
      JWT_SECRET: local-development-only-replace-with-a-random-secret-before-production
      CLIENT_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    volumes:
      - upload_images:/app/uploads
volumes:
  postgres_data:
  upload_images:
