global:
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@mini-erp.local
  smtp_require_tls: false

route:
  receiver: local-email
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: local-email
    email_configs:
      - to: developer@mini-erp.local
        send_resolved: true
